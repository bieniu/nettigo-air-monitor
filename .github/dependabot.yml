version: 2
enable-beta-ecosystems: true

# Keep tools pinned in both pyproject.toml and .pre-commit-config.yaml in sync
multi-ecosystem-groups:
  dev:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      test:
        patterns:
          - "aiointercept"
          - "freezegun"
          - "pytest"
          - "pytest-*"
          - "syrupy"
    ignore:
      - dependency-name: "aiohttp"
      - dependency-name: "tenacity"
      - dependency-name: "dacite"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ci:
        patterns: ["*"]

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pre-commit:
        patterns: ["*"]
        exclude-patterns:
          - "*/astral-sh/ruff-pre-commit"
          - "*/astral-sh/ty-pre-commit"

  - package-ecosystem: "uv"
    directory: "/"
    patterns:
      - "prek"
      - "ruff"
      - "ty"
    multi-ecosystem-group: "dev"

  - package-ecosystem: "pre-commit"
    directory: "/"
    patterns:
      - "*/astral-sh/ruff-pre-commit"
      - "*/astral-sh/ty-pre-commit"
    multi-ecosystem-group: "dev"
